<!DOCTYPE HTML>
<html>
   <head>
      <title>I Love NY T-Shirt</title>

      <style>
         .container {
            position: relative;
            width: 420px;
            background-color: lightgray;
            padding: 20px;
         }

         img {
            position: relative;
            left: 10px;
            width: 350px;
            border: 4px solid black;
            padding: 10px;
            margin: 10px;
            box-shadow: 8px 8px 12px gray;
            z-index: 1;
         }

         .words {
            font-family: impact;
            font-size: 60px;
         }

         .first {
            position: absolute;
            top: 115px;
            left: 220px;
            z-index: 2;
         }

         .heart {
            color: red;
            font-size: 80px;
            position: absolute;
            top: 165px;
            left: 207px;
            z-index: 2;
         }

         .last {
            position: absolute;
            top: 255px;
            left: 189px;
            z-index: 2;
         }
      </style>
   </head>

   <body>
      <div class="container">
         <span class="first words">I</span>
         <span class="heart">&hearts;</span>
         <span class="last words">NY</span>

         <div>
            <img src="tshirt.jpeg" alt="White t-shirt">
         </div>
      </div>
   </body>
</html>
